<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#167a52">
  <title>たまフィットPFC</title>
  <link rel="stylesheet" href="./clean/assets/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">PFC</div><div><strong>たまフィットPFC</strong><small>食事を、話して記録</small></div></div>
  <div class="top-actions"><span class="build">CLEAN 1.0</span><button class="icon-btn" id="reload-btn" title="再読み込み">↻</button></div>
</header>
<main class="app-shell">
  <section id="view-home"></section>
  <section id="view-history" hidden></section>
  <section id="view-body" hidden></section>
  <section id="view-settings" hidden></section>
</main>
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="home"><span>⌂</span>ホーム</button>
  <button class="nav-btn" data-view="history"><span>◷</span>履歴</button>
  <button class="nav-btn" data-view="body"><span>♙</span>からだ</button>
  <button class="nav-btn" data-view="settings"><span>⚙</span>設定</button>
</nav>
<div id="voice-modal" class="modal" hidden><div class="modal-sheet" id="voice-sheet"></div></div>
<div id="manual-modal" class="modal" hidden><div class="modal-sheet small-sheet" id="manual-sheet"></div></div>
<div id="toast"></div>

<!-- Clean runtime only. Legacy code is not part of the active boot path. -->
<script src="./clean/assets/base-foods.js"></script>
<script>globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__ = DB;</script>
<script type="module" src="./clean/src/main.js"></script>
</body>
</html>
