<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#187a51">
  <title>たまフィットPFC</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f8f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#183126}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot-card{background:#fff;border:1px solid #dbe8e1;border-radius:22px;padding:28px 24px;box-shadow:0 8px 32px rgba(12,52,34,.08);max-width:360px;width:100%;box-sizing:border-box}.boot-mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#187a51;color:#fff;font-weight:900;margin:0 auto 14px}.boot b{display:block;font-size:18px}.boot small{display:block;margin-top:8px;color:#6d7d75;line-height:1.6}
  </style>
</head>
<body>
  <div class="boot" id="pfc-static-boot"><div class="boot-card"><div class="boot-mark">PFC</div><b>最新版を読み込んでいます</b><small>保存済みの食事データはそのままです。</small></div></div>
  <script>
  (() => {
    'use strict';
    const BUILD = '20260904-v39-static1';
    const runtimeBlock = [
      '<script src="ai-v2.js?v=20260904-ai2-fm1"><\/script>',
      '<script src="edit-fix.js?v=20260904-editfix2-fm1"><\/script>',
      '<script src="senior-v4.js?v=20260904-senior-v4"><\/script>',
      '<script src="voice-modes-v5.js?v=20260904-voice-modes-v5"><\/script>',
      '<script src="voice-modes-v6.js?v=20260904-voice-modes-v6"><\/script>',
      '<script>window.__PFC_STATIC_BOOT__={build:"'+BUILD+'",active:true};window.forceAppUpdate=async function(){try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>null)));}}catch(_){ }const u=new URL(location.href);u.searchParams.set("_fresh",Date.now());location.replace(u.href);};if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js?boot='+BUILD+'").then(r=>r.update()).catch(()=>{});}<\/script>'
    ].join('\n');

    async function boot() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js?boot=' + BUILD).then(r => r.update()).catch(() => {});
        }
        const res = await fetch('./legacy-index.html?core=' + BUILD, { cache: 'no-store' });
        if (!res.ok) throw new Error('core HTTP ' + res.status);
        let html = await res.text();
        html = html.replace('>V35<', '>V39 VOICE<');
        html = html.includes('</body>')
          ? html.replace('</body>', runtimeBlock + '\n</body>')
          : html + '\n' + runtimeBlock;
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        console.error('[PFC static bootstrap] failed', err);
        const host = document.getElementById('pfc-static-boot');
        if (host) host.innerHTML = '<div class="boot-card"><div class="boot-mark">!</div><b>最新版の読み込みに失敗しました</b><small>下の修復ページを1回だけ開いてください。食事データは消えません。</small><p><a href="./repair.html" style="display:inline-block;margin-top:10px;padding:12px 18px;border-radius:12px;background:#187a51;color:white;text-decoration:none;font-weight:800">表示を修復する</a></p></div>';
      }
    }
    boot();
  })();
  </script>
</body>
</html>
