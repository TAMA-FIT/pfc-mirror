name: PFC nutrition lookup diagnostics check

on:
  pull_request:
    paths:
      - 'clean/src/live/nutrition-diagnostics-v1722.js'
      - 'index.html'
      - 'clean/index.html'
      - '.github/workflows/pfc-nutrition-diagnostics-check.yml'
  workflow_dispatch:

jobs:
  nutrition-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check diagnostics module
        run: node --check clean/src/live/nutrition-diagnostics-v1722.js
      - name: Diagnostics contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const diag=fs.readFileSync('./clean/src/live/nutrition-diagnostics-v1722.js','utf8');
          assert.match(diag,/taskType==='nutritionLookup'/);
          assert.match(diag,/response\.clone\(\)\.text\(\)/);
          for(const token of ['HTTP','gasBuild','googleStatus','message','webSearchQueries','AbortError','REDACTED_KEY']) assert.match(diag,new RegExp(token));
          assert.match(diag,/診断をコピー/);
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            const diagnostics=html.indexOf('nutrition-diagnostics-v1722.js?v=1.7.22');
            const main=html.indexOf('main-v160.js?v=1.7.21');
            assert.ok(diagnostics>=0&&main>diagnostics);
          }
          console.log('visible official-search diagnostics contract: OK');
          NODE
