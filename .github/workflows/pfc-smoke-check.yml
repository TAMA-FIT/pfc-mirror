name: PFC smoke check

on:
  pull_request:
    paths:
      - 'clean/**/*.js'
      - 'clean/**/*.html'
      - 'index.html'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed runtime modules
        run: |
          node --check clean/src/features/targets.js
          node --check clean/src/features/alcohol.js
          node --check clean/src/dev/realistic-decoy.js
          node --check clean/src/senior-v160.js
      - name: Contract checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { calculateTarget } from './clean/src/features/targets.js';
          import { alcoholUiModel } from './clean/src/features/alcohol.js';

          const std = calculateTarget(2000, 'std');
          assert.equal(std.p, 150);
          assert.equal(std.f, 44.4);
          assert.equal(std.c, 250);

          const lowfat = calculateTarget(1600, 'lowfat');
          assert.equal(lowfat.p, 120);
          assert.equal(lowfat.f, 17.8);
          assert.equal(lowfat.c, 240);

          const alcohol = alcoholUiModel([{A:13.7},{A:7.1}]);
          assert.equal(alcohol.visible, true);
          assert.equal(alcohol.grams, 20.8);
          assert.equal(alcohol.estimatedKcal, 146);

          const none = alcoholUiModel([{A:0}]);
          assert.equal(none.visible, false);
          console.log('PFC v1.6.0 smoke contracts: OK');
          NODE
