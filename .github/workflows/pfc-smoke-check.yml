name: PFC smoke check

on:
  pull_request:
    paths:
      - 'clean/**/*.js'
      - 'clean/**/*.html'
      - 'index.html'
      - '.github/workflows/pfc-smoke-check.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runtime
        run: |
          node --check clean/src/features/targets-v160.js
          node --check clean/src/dev/manager-v160.js
          node --check clean/src/v160.js
          node --check clean/src/main-v160.js
          node --check clean/src/live/config-v170.js
          node --check clean/src/live/draft-v170.js
          node --check clean/src/live/transport-v170.js
          node --check clean/src/live/transcribe-v178.js
          node --check clean/src/live/audio-v170.js
          node --check clean/src/live/live-playback-worklet-v1711.js
          node --check clean/src/live/transcript-v177.js
          node --check clean/src/live/live-v170.js
      - name: Target contracts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { calculateTarget } from './clean/src/features/targets-v160.js';

          const std = calculateTarget(2000, 'std');
          assert.equal(std.p, 150);
          assert.equal(std.f, 44.4);
          assert.equal(std.c, 250);

          const lowfat = calculateTarget(1600, 'lowfat');
          assert.equal(lowfat.p, 120);
          assert.equal(lowfat.f, 17.8);
          assert.equal(lowfat.c, 240);

          const keto = calculateTarget(1200, 'keto');
          assert.equal(keto.p, 90);
          assert.equal(keto.f, 80);
          assert.equal(keto.c, 30);
          console.log('PFC target contracts: OK');
          NODE
      - name: Gemini Live setup contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { LIVE_MODEL, LIVE_VERSION, SYSTEM_INSTRUCTION, buildSetupMessage, buildOpeningMessage } from './clean/src/live/config-v170.js';

          assert.equal(LIVE_VERSION, 'v1.7.14');
          assert.equal(LIVE_MODEL, 'gemini-3.1-flash-live-preview');
          const message = buildSetupMessage();
          assert.equal(message.setup.model, 'models/gemini-3.1-flash-live-preview');
          assert.deepEqual(message.setup.generationConfig.responseModalities, ['AUDIO']);
          assert.equal(message.setup.tools[0].functionDeclarations[0].name, 'update_meal_draft');
          assert.equal(message.setup.realtimeInputConfig.automaticActivityDetection.silenceDurationMs, 1400);
          assert.match(SYSTEM_INSTRUCTION, /質問や音声返答より先に update_meal_draft/);
          assert.match(SYSTEM_INSTRUCTION, /何時に食べましたか/);
          assert.match(SYSTEM_INSTRUCTION, /画面の内容で合っていれば登録ボタンを押してください/);
          assert.match(buildOpeningMessage().realtimeInput.text, /現在時刻によるアプリの自動補完/);
          console.log('Gemini Live v1.7.14 conversation UX contract: OK');
          NODE
      - name: Dedicated Live Transcribe contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            TRANSCRIBE_MODEL,
            TRANSCRIBE_LANGUAGE,
            TRANSCRIBE_MODE,
            TRANSCRIBE_CUSTOM_VOCABULARY,
            buildTranscribeSetupMessage
          } from './clean/src/live/transcribe-v178.js';

          assert.equal(TRANSCRIBE_MODEL, 'gemini-3.5-transcribe-live');
          assert.equal(TRANSCRIBE_LANGUAGE, 'ja-JP');
          assert.equal(TRANSCRIBE_MODE, 'SMART');
          assert.ok(TRANSCRIBE_CUSTOM_VOCABULARY.includes('鶏胸肉'));
          assert.ok(TRANSCRIBE_CUSTOM_VOCABULARY.includes('納豆'));
          assert.ok(TRANSCRIBE_CUSTOM_VOCABULARY.length <= 100);
          const message = buildTranscribeSetupMessage();
          assert.equal(message.setup.model, 'models/gemini-3.5-transcribe-live');
          assert.deepEqual(message.setup.generationConfig.responseModalities, ['TEXT']);
          assert.deepEqual(message.setup.inputAudioTranscription.languageCodes, ['ja-JP']);
          assert.equal(message.setup.inputAudioTranscription.mode, 'SMART');
          assert.deepEqual(message.setup.inputAudioTranscription.customVocabulary, TRANSCRIBE_CUSTOM_VOCABULARY);
          console.log('Gemini 3.5 Transcribe Live contract: OK');
          NODE
      - name: Live WebSocket frame decoding
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { decodeWebSocketMessage } from './clean/src/live/transport-v170.js';

          assert.deepEqual(
            await decodeWebSocketMessage('{"setupComplete":{}}'),
            { setupComplete: {} }
          );

          const blob = new Blob(['{"serverContent":{"turnComplete":true}}'], { type: 'application/json' });
          assert.deepEqual(
            await decodeWebSocketMessage(blob),
            { serverContent: { turnComplete: true } }
          );

          const arrayBuffer = new TextEncoder().encode('{"goAway":{"timeLeft":"1s"}}').buffer;
          assert.deepEqual(
            await decodeWebSocketMessage(arrayBuffer),
            { goAway: { timeLeft: '1s' } }
          );

          console.log('Gemini Live WebSocket frame decoding: OK');
          NODE
      - name: Live transcript coalescing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mergeTranscriptFragment } from './clean/src/live/transcript-v177.js';

          assert.equal(mergeTranscriptFragment('', '鶏胸肉'), '鶏胸肉');
          assert.equal(mergeTranscriptFragment('今日は鶏胸', '今日は鶏胸肉200g'), '今日は鶏胸肉200g');
          assert.equal(mergeTranscriptFragment('鶏胸肉ですね。皮は', '皮はありですか？'), '鶏胸肉ですね。皮はありですか？');
          assert.equal(mergeTranscriptFragment('納豆はどのくらいでしたか？', '納豆はどのくらいでしたか？'), '納豆はどのくらいでしたか？');
          assert.equal(mergeTranscriptFragment('量は200', 'gです'), '量は200 gです');
          console.log('Gemini Live transcript coalescing: OK');
          NODE
      - name: Live audio jitter buffering
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            LIVE_AUDIO_TARGET_BUFFER_SEC,
            LIVE_AUDIO_REBUFFER_THRESHOLD_SEC,
            LIVE_AUDIO_START_DELAY_SEC,
            shouldStartBufferedPlayback,
            shouldRebuffer
          } from './clean/src/live/audio-v170.js';

          assert.equal(LIVE_AUDIO_TARGET_BUFFER_SEC, 0.30);
          assert.equal(LIVE_AUDIO_REBUFFER_THRESHOLD_SEC, 0.06);
          assert.equal(LIVE_AUDIO_START_DELAY_SEC, 0.02);
          assert.equal(shouldStartBufferedPlayback(0.29), false);
          assert.equal(shouldStartBufferedPlayback(0.30), true);
          assert.equal(shouldRebuffer(10, 10.20), false);
          assert.equal(shouldRebuffer(10, 10.05), true);
          assert.equal(shouldRebuffer(10, 10.06), true);
          console.log('Gemini Live 300ms jitter buffering: OK');
          NODE
      - name: Live AudioWorklet continuous queue
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';

          globalThis.sampleRate = 48000;
          let Processor = null;
          class StubAudioWorkletProcessor {
            constructor(){
              this.port = {
                messages: [],
                onmessage: null,
                postMessage(message){ this.messages.push(message); }
              };
            }
          }
          globalThis.AudioWorkletProcessor = StubAudioWorkletProcessor;
          globalThis.registerProcessor = (name, cls) => {
            assert.equal(name, 'pfc-live-pcm-player');
            Processor = cls;
          };
          vm.runInThisContext(fs.readFileSync('./clean/src/live/live-playback-worklet-v1711.js', 'utf8'));
          assert.ok(Processor);
          const player = new Processor({ processorOptions: { targetBufferSec: 0.30 } });
          const send = data => player.port.onmessage({ data });
          send({ type: 'push', rate: 24000, samples: new Float32Array(3600).fill(0.25) });
          send({ type: 'push', rate: 24000, samples: new Float32Array(3600).fill(0.25) });
          let frames = [];
          for(let n=0;n<2;n++){
            const out = new Float32Array(128);
            player.process([], [[out]]);
            frames.push(...out);
          }
          assert.ok(frames[255] > 0.24);
          send({ type: 'flush' });
          for(let n=0;n<200&&!player.port.messages.some(x=>x.type==='drain');n++){
            const out = new Float32Array(128);
            player.process([], [[out]]);
            frames.push(...out);
          }
          assert.ok(player.port.messages.some(x=>x.type==='drain'));
          assert.equal(player.port.messages.some(x=>x.type==='underflow'), false);
          const steady = frames.slice(300, 13000).filter(x=>x!==0);
          assert.ok(steady.length > 10000);
          assert.ok(steady.every(x=>Math.abs(x-0.25)<1e-6));
          console.log('Gemini Live AudioWorklet continuous queue: OK');
          NODE
      - name: Live diagnostics and GAS fetch contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const transport = fs.readFileSync('./clean/src/live/transport-v170.js', 'utf8');
          const transcribe = fs.readFileSync('./clean/src/live/transcribe-v178.js', 'utf8');
          const live = fs.readFileSync('./clean/src/live/live-v170.js', 'utf8');
          const main = fs.readFileSync('./clean/src/main.js', 'utf8');
          const audio = fs.readFileSync('./clean/src/live/audio-v170.js', 'utf8');
          assert.match(transport, /taskType:'liveToken'/);
          assert.match(transport, /export async function issueLiveToken/);
          assert.match(transport, /'Content-Type':'text\/plain'/);
          assert.match(transport, /redirect:'follow'/);
          assert.doesNotMatch(transport, /Accept':'application\/json'/);
          assert.doesNotMatch(transport, /cache:'no-store'/);
          assert.match(transport, /decodeWebSocketMessage/);
          assert.match(transport, /data instanceof Blob/);
          assert.match(transport, /data instanceof ArrayBuffer/);
          assert.match(transport, /onTrace/);
          assert.match(transport, /config-v170\.js\?v=1\.7\.14/);
          assert.match(transcribe, /gemini-3\.5-transcribe-live/);
          assert.match(transcribe, /languageCodes: \[TRANSCRIBE_LANGUAGE\]/);
          assert.match(transcribe, /mode: TRANSCRIBE_MODE/);
          assert.match(live, /GeminiLiveTranscriber/);
          assert.match(live, /LIVE_DEBUG/);
          assert.match(live, /connectTranscriberInBackground/);
          assert.match(live, /Promise\.all\(\[audioReady,liveReady\]\)/);
          assert.match(live, /if\(transcriberReady\)transcriber\?\.sendAudio\(bytes\)/);
          assert.match(live, /warmLiveRuntime/);
          assert.match(live, /LIVE_MUTE_STORAGE_KEY/);
          assert.match(live, /data-live-action="toggle-mute"/);
          assert.match(live, /!diagnosticReplayActive&&!aiMuted/);
          assert.match(live, /talk\.removeAttribute\('data-action'\)/);
          assert.match(live, /talk\.dataset\.liveAction='start'/);
          assert.doesNotMatch(live, /insertAdjacentHTML\('afterend'/);
          assert.match(live, /config-v170\.js\?v=1\.7\.14/);
          assert.match(live, /transport-v170\.js\?v=1\.7\.14/);
          assert.match(live, /live-v170\.css\?v=1\.7\.14/);
          assert.match(main, /class=\"senior-talk-btn senior-live-btn\" data-live-action=\"start\"/);
          assert.doesNotMatch(main, /class=\"senior-talk-btn\" data-action=\"voice\"/);
          assert.match(live, /transport\?\.sendAudio\(bytes\)/);
          assert.match(live, /transcriber\?\.sendAudio\(bytes\)/);
          assert.match(live, /if\(!transcriberReady\)acceptInputTranscript\(t\)/);
          assert.match(live, /audio\?\.completeModelTurn/);
          assert.match(live, /data-live-action="replay-pcm"/);
          assert.match(live, /data-live-action="replay-pcm-chunked"/);
          assert.match(live, /audio-v170\.js\?v=1\.7\.12/);
          assert.match(audio, /replayLastTurnRaw/);
          assert.match(audio, /replayLastTurnChunked/);
          assert.match(audio, /live-playback-worklet-v1711\.js\?v=1\.7\.11/);
          assert.match(audio, /AudioWorkletNode/);
          assert.match(audio, /concatInt16/);
          assert.match(audio, /diagnosticReplayActive/);
          console.log('Live diagnostics, PCM replay, dual-stream, GAS fetch, and v1.7.14 UX contract: OK');
          NODE
