name: PFC Live v1.7.25 Tavily truth-sync check

on:
  pull_request:
    paths:
      - 'clean/src/live/config-v1720.js'
      - 'clean/src/live/live-guard-v1720.js'
      - 'clean/src/live/nutrition-lookup-v1720.js'
      - 'clean/src/live/live-v1720.js'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-live-free-tier-hotfix-check.yml'
  workflow_dispatch:

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check v1.7.25 runtime
        run: |
          node --check clean/src/live/config-v1720.js
          node --check clean/src/live/live-guard-v1720.js
          node --check clean/src/live/nutrition-lookup-v1720.js
          node --check clean/src/live/live-v1720.js
          node --check clean/src/main-v160.js

      - name: Live delegates official lookup to Tavily pipeline
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {LIVE_VERSION,LIVE_MODEL,SYSTEM_INSTRUCTION,buildSetupMessage} from './clean/src/live/config-v1720.js';
          assert.equal(LIVE_VERSION,'v1.7.25');
          assert.equal(LIVE_MODEL,'gemini-3.1-flash-live-preview');
          const setup=buildSetupMessage().setup;
          assert.equal(setup.tools.length,1);
          assert.equal(setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          assert.equal(JSON.stringify(setup.tools).includes('googleSearch'),false);
          assert.match(SYSTEM_INSTRUCTION,/Tavily/);
          assert.match(SYSTEM_INSTRUCTION,/Gemini 3\.1 Flash Lite/);
          assert.match(SYSTEM_INSTRUCTION,/検索がverifiedになる前/);
          assert.match(SYSTEM_INSTRUCTION,/公式情報によると/);
          assert.match(SYSTEM_INSTRUCTION,/official-webはアプリ側のTavily/);
          assert.doesNotMatch(SYSTEM_INSTRUCTION,/Gemini 2\.5 Flash \+ Google Search/);
          console.log('Live Tavily delegation policy: OK');
          NODE

      - name: Tavily lookup client contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          globalThis.location={search:''};
          globalThis.localStorage={getItem:()=>null,setItem:()=>{}};
          const mod=await import('./clean/src/live/nutrition-lookup-v1720.js');
          const {NUTRITION_LOOKUP_MODEL,NUTRITION_LOOKUP_VERSION,NUTRITION_LOOKUP_TIMEOUT_MS,buildNutritionLookupPayload,validateGroundedNutrition,nutritionLookupCacheKey}=mod;
          assert.equal(NUTRITION_LOOKUP_MODEL,'Tavily + Gemini 3.1 Flash Lite');
          assert.equal(NUTRITION_LOOKUP_TIMEOUT_MS,22000);
          assert.equal(NUTRITION_LOOKUP_VERSION,'v1.7.25-tavily');
          const payload=buildNutritionLookupPayload({foodName:'マックフライポテト L',contextText:'マックでポテトL',candidateNames:['マクドナルド マックフライポテト L']});
          assert.equal(payload.taskType,'nutritionLookup');
          const verified=validateGroundedNutrition({status:'verified',grounded:true,officialSource:true,brand:'McDonald’s',productName:'マックフライポテト',servingLabel:'Lサイズ',kcal:517,p:7,f:25.2,c:66,sourceLabel:'マクドナルド公式',sourceUrl:'https://www.mcdonalds.co.jp/products/2050/',sourceDomain:'mcdonalds.co.jp',searchProvider:'tavily',model:'gemini-3.1-flash-lite',verificationMethod:'tavily+official-page-fetch',officialFetchStatus:200,searchCredits:1});
          assert.equal(verified.kcal,517);
          assert.equal(verified.searchProvider,'tavily');
          assert.equal(verified.model,'gemini-3.1-flash-lite');
          assert.equal(verified.searchCredits,1);
          const key1=nutritionLookupCacheKey(payload);
          const key2=nutritionLookupCacheKey({...payload,candidateNames:['別候補']});
          assert.notEqual(key1,key2);
          const lookup=fs.readFileSync('./clean/src/live/nutrition-lookup-v1720.js','utf8');
          assert.match(lookup,/search=Tavily/);
          assert.match(lookup,/Gemini 3\.1 Flash Lite/);
          assert.doesNotMatch(lookup,/gemini-2\.5-flash/);
          assert.doesNotMatch(lookup,/upstream-retry/);
          console.log('Tavily lookup client: OK');
          NODE

      - name: Truth-sync and stale-result guard remain intact
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          const guard=fs.readFileSync('./clean/src/live/live-guard-v1720.js','utf8');
          assert.match(live,/lookupOfficialNutrition/);
          assert.match(live,/lookupFingerprint/);
          assert.match(live,/official-stale/);
          assert.match(live,/official-reset/);
          assert.match(live,/nutritionSource:'official-web'/);
          assert.match(live,/buildOfficialResolvedMessage\(\{item:updated,ready:draft\.isReady\(\)\}\)/);
          assert.match(guard,/__PFC_OFFICIAL_LOOKUP_NOT_FOUND__/);
          assert.match(guard,/Tavilyによる日本向け公式検索/);
          assert.match(guard,/Tavily公式検索 \+ Gemini 3\.1 Flash Lite抽出/);
          assert.match(guard,/内部知識からkcal\/P\/F\/Cを読み上げ/);
          console.log('Truth-sync and stale-result guard: OK');
          NODE

      - name: Persistent lookup diagnostics remain state-driven
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          const lookup=fs.readFileSync('./clean/src/live/nutrition-lookup-v1720.js','utf8');
          assert.match(live,/lookupDiagnosticPanelHtml/);
          assert.match(live,/data-lookup-diagnostic-panel/);
          assert.match(live,/data-live-action="copy-lookup-diag"/);
          assert.match(live,/nutrition-lookup-v1720\.js\?v=1\.7\.25/);
          assert.match(lookup,/v1\.7\.25-tavily/);
          assert.match(lookup,/searchProvider/);
          assert.match(lookup,/tavilyRequestId/);
          assert.match(lookup,/searchCredits/);
          assert.doesNotMatch(lookup,/document\.querySelector/);
          console.log('Persistent Tavily diagnostics: OK');
          NODE

      - name: Browser back still releases microphone
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          const audio=fs.readFileSync('./clean/src/live/audio-v170.js','utf8');
          assert.match(live,/history\.pushState/);
          assert.match(live,/addEventListener\('popstate'/);
          assert.match(live,/cleanupLiveSession/);
          assert.match(live,/a\?\.stopCapture/);
          assert.doesNotMatch(live,/visibilitychange/);
          assert.match(audio,/track\.stop\(\)/);
          console.log('Browser-back mic release: OK');
          NODE

      - name: Production wiring is v1.7.25 Tavily
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const entry=fs.readFileSync('./clean/src/main-v160.js','utf8');
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          assert.match(entry,/live-v1720\.js\?v=1\.7\.25/);
          assert.match(live,/config-v1720\.js\?v=1\.7\.25/);
          assert.match(live,/live-guard-v1720\.js\?v=1\.7\.25/);
          assert.match(live,/nutrition-lookup-v1720\.js\?v=1\.7\.25/);
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/v1\.7\.25/);
            assert.match(html,/main-v160\.js\?v=1\.7\.25/);
          }
          console.log('v1.7.25 Tavily cache chain: OK');
          NODE
