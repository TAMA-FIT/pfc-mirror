name: PFC Live v1.7.28 MEXT-grounded check

on:
  pull_request:
    paths:
      - 'clean/src/data/foods.js'
      - 'clean/src/live/config-v1720.js'
      - 'clean/src/live/draft-v1716.js'
      - 'clean/src/live/generic-fallback-v1727.js'
      - 'clean/src/live/live-guard-v1720.js'
      - 'clean/src/live/nutrition-lookup-mext-v1728.js'
      - 'clean/src/live/live-v1720.js'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-live-free-tier-hotfix-check.yml'
  workflow_dispatch:

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check runtime
        run: |
          node --check clean/src/data/foods.js
          node --check clean/src/live/config-v1720.js
          node --check clean/src/live/draft-v1716.js
          node --check clean/src/live/generic-fallback-v1727.js
          node --check clean/src/live/live-guard-v1720.js
          node --check clean/src/live/nutrition-lookup-mext-v1728.js
          node --check clean/src/live/live-v1720.js
          node --check clean/src/main-v160.js

      - name: Live delegates nutrition truth to MEXT data
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {LIVE_VERSION,LIVE_MODEL,SYSTEM_INSTRUCTION,UPDATE_MEAL_DRAFT_DECLARATION,buildSetupMessage} from './clean/src/live/config-v1720.js';
          assert.equal(LIVE_VERSION,'v1.7.25');
          assert.equal(LIVE_MODEL,'gemini-3.1-flash-live-preview');
          const setup=buildSetupMessage().setup;
          assert.equal(setup.tools.length,1);
          assert.equal(setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          const props=UPDATE_MEAL_DRAFT_DECLARATION.parametersJsonSchema.properties.operations.items.properties;
          assert.ok(props.components);
          assert.deepEqual(props.nutritionSource.enum,['user-label']);
          assert.match(SYSTEM_INSTRUCTION,/文部科学省/);
          assert.match(SYSTEM_INSTRUCTION,/components/);
          assert.match(SYSTEM_INSTRUCTION,/P\/F\/C\/kcalを生成してはいけません/);
          assert.doesNotMatch(SYSTEM_INSTRUCTION,/Tavily公式検索/);
          console.log('MEXT-grounded Live policy: OK');
          NODE

      - name: Restaurant Web lookup adapter makes no network request
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let fetchCalls=0;
          globalThis.fetch=async()=>{fetchCalls++;throw new Error('network must stay off')};
          globalThis.location={search:''};
          const mod=await import('./clean/src/live/nutrition-lookup-mext-v1728.js');
          assert.equal(mod.NUTRITION_LOOKUP_VERSION,'v1.7.28-mext-only');
          assert.equal(mod.NUTRITION_LOOKUP_TIMEOUT_MS,0);
          const r=await mod.lookupOfficialNutrition({foodName:'CoCo壱番屋 ポークカレー'});
          assert.equal(r.status,'not_found');
          assert.equal(r.errorCode,'MEXT_ONLY_MODE');
          assert.equal(fetchCalls,0);
          assert.match(mod.formatLookupDiagnosticsText(),/MEXT|Web lookup is disabled/i);
          console.log('MEXT-only lookup adapter: OK');
          NODE

      - name: Recovery instructs MEXT components, never raw AI PFC
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {buildInternalRecoveryMessage,LIVE_GUARD_VERSION} from './clean/src/live/live-guard-v1720.js';
          assert.equal(LIVE_GUARD_VERSION,'v1.7.28-mext-grounded');
          const msg=buildInternalRecoveryMessage({userText:'謎のバーガー',items:[{ref:'x',name:'謎のバーガー',unresolved:true,candidateNames:[]}],attempt:1});
          assert.match(msg,/文部科学省/);
          assert.match(msg,/components/);
          assert.match(msg,/nutritionSource="ai-estimate"は禁止/);
          assert.doesNotMatch(msg,/Tavilyによる日本向け公式検索/);
          console.log('MEXT recovery guard: OK');
          NODE

      - name: Import map routes old Live lookup specifier to MEXT adapter
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/nutrition-lookup-v1720\.js\?v=1\.7\.25[^\n]*nutrition-lookup-mext-v1728\.js\?v=1\.7\.28/);
            assert.match(html,/config-v1720\.js\?v=1\.7\.28/);
            assert.match(html,/draft-v1716\.js\?v=1\.7\.28/);
            assert.match(html,/live-guard-v1720\.js\?v=1\.7\.28/);
          }
          console.log('MEXT runtime cache routing: OK');
          NODE

      - name: Browser back still releases microphone
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          const audio=fs.readFileSync('./clean/src/live/audio-v170.js','utf8');
          assert.match(live,/history\.pushState/);
          assert.match(live,/addEventListener\('popstate'/);
          assert.match(live,/cleanupLiveSession/);
          assert.match(live,/a\?\.stopCapture/);
          assert.doesNotMatch(live,/visibilitychange/);
          assert.match(audio,/track\.stop\(\)/);
          console.log('Browser-back mic release: OK');
          NODE
