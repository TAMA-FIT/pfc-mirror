name: PFC Live v1.7.19 flow check

on:
  pull_request:
    paths:
      - 'clean/src/live/config-v1719.js'
      - 'clean/src/live/transport-v1719.js'
      - 'clean/src/live/live-guard-v1719.js'
      - 'clean/src/live/live-v1719.js'
      - 'clean/src/live/draft-v1716.js'
      - 'clean/src/nutrition/evidence-v1716.js'
      - 'clean/assets/live-v170.css'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-live-free-tier-hotfix-check.yml'
  workflow_dispatch:

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check current Live runtime
        run: |
          node --check clean/src/live/config-v1719.js
          node --check clean/src/live/transport-v1719.js
          node --check clean/src/live/live-guard-v1719.js
          node --check clean/src/live/live-v1719.js

      - name: Free-tier setup is native and search-free
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {LIVE_VERSION,LIVE_MODEL,SYSTEM_INSTRUCTION,buildSetupMessage} from './clean/src/live/config-v1719.js';
          assert.equal(LIVE_VERSION,'v1.7.19');
          assert.equal(LIVE_MODEL,'gemini-3.1-flash-live-preview');
          const setup=buildSetupMessage().setup;
          assert.equal(setup.tools.length,1);
          assert.equal(setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          assert.equal(JSON.stringify(setup.tools).includes('googleSearch'),false);
          assert.match(SYSTEM_INSTRUCTION,/同じターン内に必ず/);
          assert.match(SYSTEM_INSTRUCTION,/nutritionSource="ai-estimate"/);
          assert.match(SYSTEM_INSTRUCTION,/ready=false/);
          assert.match(SYSTEM_INSTRUCTION,/__PFC_INTERNAL_RECOVERY__/);
          assert.match(SYSTEM_INSTRUCTION,/Google Searchもofficial-webも使用しません/);
          console.log('Native free-tier setup: OK');
          NODE

      - name: End-to-end turn recovery contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          import {
            normalizeProvisionalFoodName,
            shouldRecoverTurn,
            buildInternalRecoveryMessage,
            evidenceMacroLine
          } from './clean/src/live/live-guard-v1719.js';

          assert.equal(normalizeProvisionalFoodName('ポテト（L）'),'ポテト(L)');
          assert.equal(normalizeProvisionalFoodName('サムライマック食べた'),'サムライマック');
          assert.equal(normalizeProvisionalFoodName('普通のやつ'),'');
          assert.equal(shouldRecoverTurn({userText:'ポテト（L）',items:[],ready:false}),true);
          assert.equal(shouldRecoverTurn({userText:'普通のやつ',items:[],ready:false}),false);

          const baseCode=fs.readFileSync('./clean/assets/base-foods.js','utf8')
            .replace(/^const DB\s*=\s*/, 'globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__ = ');
          vm.runInThisContext(baseCode);
          const {LiveMealDraft}=await import('./clean/src/live/draft-v1716.js?e2e=1719');

          // Exact real-device failure mode: model replies verbally but never calls the tool.
          // App-side guard creates a provisional card, so the memo cannot remain empty forever.
          const potato=new LiveMealDraft();
          let result=potato.applyFunctionCall({id:'local-card',args:{operations:[{op:'add',name:normalizeProvisionalFoodName('ポテト（L）')}]}});
          assert.equal(result.draft.length,1);
          const ref=result.draft[0].ref;

          if(!result.ready){
            assert.equal(shouldRecoverTurn({userText:'ポテト（L）',items:result.draft,ready:false}),true);
            const internal=buildInternalRecoveryMessage({userText:'ポテト（L）',items:result.draft,attempt:1});
            assert.match(internal,/ai-estimate/);
            assert.match(internal,/ready=true/);
            result=potato.applyFunctionCall({id:'ai-estimate',args:{operations:[{
              op:'update',ref,p:5.4,f:23,c:55,kcal:454,nutritionSource:'ai-estimate',servingLabel:'Lサイズ1個'
            }]}});
          }
          assert.equal(result.ready,true);
          const item=result.draft[0];
          if(item.nutritionEvidence){
            assert.match(evidenceMacroLine(item),/P 5\.4g/);
            assert.match(evidenceMacroLine(item),/F 23g/);
            assert.match(evidenceMacroLine(item),/C 55g/);
          }

          const unknown=new LiveMealDraft();
          result=unknown.applyFunctionCall({id:'label',args:{operations:[{
            op:'add',name:'新商品カツ丼',p:18.5,f:24,c:82,nutritionSource:'user-label',servingLabel:'1パック'
          }]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].nutritionEvidence.kcal,618);
          console.log('Speech -> card -> evidence -> ready flow: OK');
          NODE

      - name: Card preview and registration gate contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1719.js','utf8');
          const css=fs.readFileSync('./clean/assets/live-v170.css','utf8');
          assert.match(live,/itemNutritionLine/);
          assert.match(live,/pfc-live-food-macros/);
          assert.match(live,/const ready=draft\.isReady\(\)/);
          assert.match(live,/data-live-action="register" \$\{ready\?'':'disabled'\}/);
          assert.match(live,/buildEvidenceRecord/);
          assert.match(live,/buildRecord/);
          assert.match(css,/\.pfc-live-food-macros/);
          console.log('Card nutrition preview + ready gate: OK');
          NODE

      - name: Browser back releases microphone contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const live=fs.readFileSync('./clean/src/live/live-v1719.js','utf8');
          const audio=fs.readFileSync('./clean/src/live/audio-v170.js','utf8');
          assert.match(live,/history\.pushState/);
          assert.match(live,/addEventListener\('popstate'/);
          assert.match(live,/cleanupLiveSession/);
          assert.match(live,/a\?\.stopCapture/);
          assert.match(live,/addEventListener\('pagehide',emergencyRelease\)/);
          assert.match(live,/addEventListener\('beforeunload',emergencyRelease\)/);
          assert.doesNotMatch(live,/visibilitychange/);
          assert.match(audio,/for\(const track of this\.stream\?\.getTracks/);
          assert.match(audio,/track\.stop\(\)/);
          console.log('Browser-back mic release contract: OK');
          NODE

      - name: Production wiring uses only v1.7.19 Live runtime
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const entry=fs.readFileSync('./clean/src/main-v160.js','utf8');
          assert.match(entry,/live-v1719\.js\?v=1\.7\.19/);
          assert.doesNotMatch(entry,/free-tier-search-hotfix-v1717/);
          assert.doesNotMatch(entry,/live-v1716\.js/);
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/v1\.7\.19/);
            assert.match(html,/main-v160\.js\?v=1\.7\.19/);
          }
          console.log('v1.7.19 production wiring: OK');
          NODE
