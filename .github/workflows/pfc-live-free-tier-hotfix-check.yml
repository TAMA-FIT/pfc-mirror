name: PFC Live free-tier hotfix check

on:
  pull_request:
    paths:
      - 'clean/src/live/free-tier-search-hotfix-v1717.js'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-live-free-tier-hotfix-check.yml'
  workflow_dispatch:

jobs:
  free-tier-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check clean/src/live/free-tier-search-hotfix-v1717.js
      - name: Strip paid Search Grounding from Live setup
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {HOTFIX_VERSION,sanitizeLiveSetupPayload} from './clean/src/live/free-tier-search-hotfix-v1717.js';
          assert.equal(HOTFIX_VERSION,'v1.7.17');
          const payload={setup:{
            tools:[{googleSearch:{}},{functionDeclarations:[{name:'update_meal_draft'}]}],
            systemInstruction:{parts:[{text:'質問・Google検索・音声返答より先に update_meal_draft。unresolvedならGoogle Searchを使う。'}]}
          }};
          const out=sanitizeLiveSetupPayload(structuredClone(payload));
          assert.equal(out.setup.tools.length,1);
          assert.equal(out.setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          assert.equal(JSON.stringify(out.setup.tools).includes('googleSearch'),false);
          assert.match(out.setup.systemInstruction.parts[0].text,/現在の無料運用ではGoogle Searchツールを使用しません/);
          assert.match(out.setup.systemInstruction.parts[0].text,/official-webは送信しないでください/);
          assert.doesNotMatch(out.setup.systemInstruction.parts[0].text,/質問・Google検索・音声返答/);
          console.log('Free-tier Live setup hotfix: OK');
          NODE
