name: PFC nutrition resolution check

on:
  pull_request:
    paths:
      - 'clean/src/live/*v1716.js'
      - 'clean/src/live/free-tier-search-hotfix-v1717.js'
      - 'clean/src/nutrition/evidence-v1716.js'
      - 'clean/src/ui-polish-v1716.js'
      - 'clean/assets/ui-polish-v1716.css'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-nutrition-resolution-check.yml'
  workflow_dispatch:

jobs:
  nutrition-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check v1.7.16 modules
        run: |
          node --check clean/src/live/config-v1716.js
          node --check clean/src/live/draft-v1716.js
          node --check clean/src/live/transport-v1716.js
          node --check clean/src/live/live-v1716.js
          node --check clean/src/live/free-tier-search-hotfix-v1717.js
          node --check clean/src/nutrition/evidence-v1716.js
          node --check clean/src/ui-polish-v1716.js
      - name: Gemini Live search and schema contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {LIVE_VERSION,LIVE_MODEL,SYSTEM_INSTRUCTION,UPDATE_MEAL_DRAFT_DECLARATION,buildSetupMessage} from './clean/src/live/config-v1716.js';
          assert.equal(LIVE_VERSION,'v1.7.16');
          assert.equal(LIVE_MODEL,'gemini-3.1-flash-live-preview');
          const setup=buildSetupMessage().setup;
          assert.deepEqual(setup.tools[0],{googleSearch:{}});
          assert.equal(setup.tools[1].functionDeclarations[0].name,'update_meal_draft');
          const props=UPDATE_MEAL_DRAFT_DECLARATION.parametersJsonSchema.properties.operations.items.properties;
          for(const key of ['p','f','c','kcal','nutritionSource','sourceLabel','sourceUrl','servingLabel']) assert.ok(props[key]);
          assert.match(SYSTEM_INSTRUCTION,/ユーザー自身がパッケージ/);
          assert.match(SYSTEM_INSTRUCTION,/unresolved の食品だけ、Google Search/);
          assert.match(SYSTEM_INSTRUCTION,/nutritionSource="ai-estimate"/);
          assert.match(SYSTEM_INSTRUCTION,/普通の量/);
          console.log('Gemini Live v1.7.16 base search/schema contract: OK');
          NODE
      - name: Nutrition evidence precedence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {normalizeNutritionEvidence,chooseNutritionMode,buildEvidenceRecord} from './clean/src/nutrition/evidence-v1716.js';
          const label=normalizeNutritionEvidence({nutritionSource:'user-label',p:18.5,f:24,c:82,servingLabel:'1パック'});
          assert.equal(label.kcal,618);
          assert.equal(label.kcalDerived,true);
          const db={foodId:'food:1',unresolved:false,needsSkin:false,needsAmount:false,amount:1,nutritionEvidence:label};
          assert.equal(chooseNutritionMode(db).mode,'evidence');
          const official=normalizeNutritionEvidence({nutritionSource:'official-web',p:30,f:20,c:45,kcal:480,sourceLabel:'公式',sourceUrl:'https://example.com/official',servingLabel:'1個'});
          assert.equal(chooseNutritionMode({...db,nutritionEvidence:official}).mode,'trusted-db');
          const unknown={name:'新商品',foodId:null,unresolved:true,needsSkin:false,needsAmount:false,amount:null,meal:'昼',nutritionEvidence:official};
          assert.equal(chooseNutritionMode(unknown).mode,'evidence');
          const record=buildEvidenceRecord(unknown,123);
          assert.equal(record.Cal,480);
          assert.equal(record._clean.nutritionSource,'official-web');
          assert.equal(record.N,'新商品(1個)');
          assert.throws(()=>normalizeNutritionEvidence({nutritionSource:'official-web',p:1,f:2,c:3}),/sourceUrl/);
          console.log('Nutrition evidence precedence: OK');
          NODE
      - name: Draft standard amount and unresolved fallback
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__=[
            ['🍚炭水化物','白米','はくまい ごはん ライス こめ 米 白米','100g',2.5,0.3,37.1,168],
            ['🍔ジャンク・菓子','カレーライス','かれーらいす カレー ごはん 米','並',12,25,100,750],
            ['🏪コンビニ','カツ丼','かつどん どんぶり コンビニ ごはん 米 肉','1個',25,30,100,800]
          ];
          const {LiveMealDraft}=await import('./clean/src/live/draft-v1716.js');
          const curry=new LiveMealDraft();
          let result=curry.applyFunctionCall({id:'1',args:{operations:[{op:'add',name:'カレーライス'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].assumed,true);
          assert.equal(result.draft[0].standardLabel,'並（1食）');

          const unknown=new LiveMealDraft();
          result=unknown.applyFunctionCall({id:'2',args:{operations:[{op:'add',name:'サムライマック'}]}});
          assert.equal(result.ready,false);
          assert.equal(result.draft[0].status,'unresolved');
          const ref=result.draft[0].ref;
          result=unknown.applyFunctionCall({id:'3',args:{operations:[{op:'update',ref,p:30,f:20,c:45,kcal:480,nutritionSource:'ai-estimate',servingLabel:'1個'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].nutritionMode,'evidence');
          assert.equal(result.draft[0].nutritionEvidence.sourceType,'ai-estimate');

          const packageValue=new LiveMealDraft();
          result=packageValue.applyFunctionCall({id:'4',args:{operations:[{op:'add',name:'カツ丼',p:18.5,f:24,c:82,nutritionSource:'user-label',sourceLabel:'パッケージ表示',servingLabel:'1パック'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].nutritionMode,'evidence');
          assert.equal(result.draft[0].nutritionEvidence.kcal,618);
          console.log('Draft fallback scenarios: OK');
          NODE
      - name: Runtime wiring and UI transparency
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const entry=fs.readFileSync('./clean/src/main-v160.js','utf8');
          const live=fs.readFileSync('./clean/src/live/live-v1716.js','utf8');
          const ui=fs.readFileSync('./clean/src/ui-polish-v1716.js','utf8');
          assert.match(entry,/free-tier-search-hotfix-v1717\.js\?v=1\.7\.18/);
          assert.match(entry,/live-v1716\.js\?v=1\.7\.18/);
          assert.match(entry,/ui-polish-v1716\.js\?v=1\.7\.16/);
          assert.match(live,/buildEvidenceRecord/);
          assert.match(live,/record\._clean\.displayAmount=item\.standardLabel/);
          assert.match(ui,/日本食品標準成分表/);
          assert.match(ui,/record-source-badge/);
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/v1\.7\.18/);
            assert.match(html,/main-v160\.js\?v=1\.7\.18/);
          }
          console.log('Runtime wiring/UI transparency: OK');
          NODE
