name: PFC nutrition resolution check

on:
  pull_request:
    paths:
      - 'clean/src/live/config-v1720.js'
      - 'clean/src/live/draft-v1716.js'
      - 'clean/src/live/live-v1720.js'
      - 'clean/src/live/live-guard-v1720.js'
      - 'clean/src/live/nutrition-lookup-v1720.js'
      - 'clean/src/nutrition/evidence-v1716.js'
      - 'clean/src/ui-polish-v1716.js'
      - 'clean/assets/ui-polish-v1716.css'
      - 'clean/src/main-v160.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-nutrition-resolution-check.yml'
  workflow_dispatch:

jobs:
  nutrition-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check current nutrition runtime
        run: |
          node --check clean/src/live/config-v1720.js
          node --check clean/src/live/draft-v1716.js
          node --check clean/src/live/live-v1720.js
          node --check clean/src/live/live-guard-v1720.js
          node --check clean/src/live/nutrition-lookup-v1720.js
          node --check clean/src/nutrition/evidence-v1716.js
          node --check clean/src/ui-polish-v1716.js

      - name: Gemini Live semantic-to-grounded nutrition contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {LIVE_VERSION,LIVE_MODEL,SYSTEM_INSTRUCTION,UPDATE_MEAL_DRAFT_DECLARATION,buildSetupMessage} from './clean/src/live/config-v1720.js';
          assert.equal(LIVE_VERSION,'v1.7.21');
          assert.equal(LIVE_MODEL,'gemini-3.1-flash-live-preview');
          const setup=buildSetupMessage().setup;
          assert.equal(setup.tools.length,1);
          assert.equal(setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          assert.equal(JSON.stringify(setup.tools).includes('googleSearch'),false);
          const props=UPDATE_MEAL_DRAFT_DECLARATION.parametersJsonSchema.properties.operations.items.properties;
          for(const key of ['p','f','c','kcal','nutritionSource','sourceLabel','sourceUrl','servingLabel']) assert.ok(props[key]);
          assert.deepEqual(props.nutritionSource.enum,['user-label','ai-estimate']);
          assert.match(SYSTEM_INSTRUCTION,/Gemini 2\.5 Flash \+ Google Search/);
          assert.match(SYSTEM_INSTRUCTION,/普通のやつ/);
          assert.match(SYSTEM_INSTRUCTION,/検索用の仮説/);
          assert.match(SYSTEM_INSTRUCTION,/現行ラインナップ/);
          assert.match(SYSTEM_INSTRUCTION,/すぐにAI推定へ落とさず/);
          assert.match(SYSTEM_INSTRUCTION,/official-webはアプリ側のGoogle検索経路だけ/);
          console.log('Gemini Live v1.7.21 semantic grounded-search policy: OK');
          NODE

      - name: Nutrition evidence precedence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {normalizeNutritionEvidence,chooseNutritionMode,buildEvidenceRecord} from './clean/src/nutrition/evidence-v1716.js';
          const label=normalizeNutritionEvidence({nutritionSource:'user-label',p:18.5,f:24,c:82,servingLabel:'1パック'});
          assert.equal(label.kcal,618);
          const db={foodId:'food:1',unresolved:false,needsSkin:false,needsAmount:false,amount:1,nutritionEvidence:label};
          assert.equal(chooseNutritionMode(db).mode,'evidence');
          const estimate=normalizeNutritionEvidence({nutritionSource:'ai-estimate',p:30,f:20,c:45,kcal:480,servingLabel:'1個'});
          assert.equal(chooseNutritionMode({...db,nutritionEvidence:estimate}).mode,'trusted-db');
          const official=normalizeNutritionEvidence({nutritionSource:'official-web',p:7,f:25.2,c:66,kcal:517,servingLabel:'Lサイズ',sourceLabel:'マクドナルド公式',sourceUrl:'https://www.mcdonalds.co.jp/products/2050/'});
          assert.equal(chooseNutritionMode({...db,nutritionEvidence:official}).mode,'evidence');
          const unknown={name:'マックフライポテト',foodId:null,unresolved:true,needsSkin:false,needsAmount:false,amount:null,meal:'昼',nutritionEvidence:official};
          assert.equal(chooseNutritionMode(unknown).mode,'evidence');
          const record=buildEvidenceRecord(unknown,123);
          assert.equal(record.Cal,517);
          assert.equal(record._clean.nutritionSource,'official-web');
          console.log('Official/user evidence outranks generic DB; AI estimate does not: OK');
          NODE

      - name: Draft standard amount, official web and user-label flow
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__=[
            ['🍚炭水化物','白米','はくまい ごはん ライス こめ 米 白米','100g',2.5,0.3,37.1,168],
            ['🍔ジャンク・菓子','カレーライス','かれーらいす カレー ごはん 米','並',12,25,100,750],
            ['🏪コンビニ','カツ丼','かつどん どんぶり コンビニ ごはん 米 肉','1個',25,30,100,800]
          ];
          const {LiveMealDraft}=await import('./clean/src/live/draft-v1716.js');
          const curry=new LiveMealDraft();
          let result=curry.applyFunctionCall({id:'1',args:{operations:[{op:'add',name:'カレーライス'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].standardLabel,'並（1食）');
          const unknown=new LiveMealDraft();
          result=unknown.applyFunctionCall({id:'2',args:{operations:[{op:'add',name:'サムライマック'}]}});
          assert.equal(result.ready,false);
          const ref=result.draft[0].ref;
          result=unknown.applyFunctionCall({id:'official',args:{operations:[{op:'update',ref,name:'炙り醤油風 ダブル肉厚ビーフ',p:38,f:37.1,c:37.2,kcal:633,nutritionSource:'official-web',sourceLabel:'マクドナルド公式',sourceUrl:'https://www.mcdonalds.co.jp/products/1220/',servingLabel:'1個'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].nutritionEvidence.sourceType,'official-web');
          const packageValue=new LiveMealDraft();
          result=packageValue.applyFunctionCall({id:'4',args:{operations:[{op:'add',name:'カツ丼',p:18.5,f:24,c:82,nutritionSource:'user-label',sourceLabel:'パッケージ表示',servingLabel:'1パック'}]}});
          assert.equal(result.ready,true);
          assert.equal(result.draft[0].nutritionEvidence.kcal,618);
          console.log('Draft resolution scenarios: OK');
          NODE

      - name: Candidate-aware official lookup cache
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.localStorage={getItem:()=>null,setItem:()=>{}};
          const {nutritionLookupCacheKey}=await import('./clean/src/live/nutrition-lookup-v1720.js');
          const a=nutritionLookupCacheKey({foodName:'サムライマック',contextText:'普通のやつ',candidateNames:['ダブル肉厚ビーフ']});
          const b=nutritionLookupCacheKey({foodName:'サムライマック',contextText:'普通のやつ',candidateNames:['たまごベーコン肉厚ビーフ']});
          assert.notEqual(a,b);
          console.log('Candidate-aware cache key: OK');
          NODE

      - name: Runtime wiring and UI transparency
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const entry=fs.readFileSync('./clean/src/main-v160.js','utf8');
          const live=fs.readFileSync('./clean/src/live/live-v1720.js','utf8');
          const ui=fs.readFileSync('./clean/src/ui-polish-v1716.js','utf8');
          assert.match(entry,/live-v1720\.js\?v=1\.7\.21/);
          assert.match(entry,/ui-polish-v1716\.js\?v=1\.7\.16/);
          assert.match(live,/config-v1720\.js\?v=1\.7\.21/);
          assert.match(live,/nutrition-lookup-v1720\.js\?v=1\.7\.21/);
          assert.match(live,/ユーザー発話:/);
          assert.match(live,/candidateNames:candidates/);
          assert.match(live,/nutritionSource:'official-web'/);
          assert.match(live,/buildEvidenceRecord/);
          assert.match(ui,/日本食品標準成分表/);
          assert.match(ui,/record-source-badge/);
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/v1\.7\.21/);
            assert.match(html,/main-v160\.js\?v=1\.7\.21/);
          }
          console.log('v1.7.21 runtime wiring/UI transparency: OK');
          NODE
