name: PFC nutrition resolution check

on:
  pull_request:
    paths:
      - 'clean/src/data/foods.js'
      - 'clean/src/nutrition/catalog.js'
      - 'clean/src/live/config-v1720.js'
      - 'clean/src/live/draft-v1716.js'
      - 'clean/src/live/generic-fallback-v1727.js'
      - 'clean/src/nutrition/evidence-v1716.js'
      - 'clean/index.html'
      - 'index.html'
      - '.github/workflows/pfc-nutrition-resolution-check.yml'
  workflow_dispatch:

jobs:
  nutrition-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check MEXT-grounded runtime
        run: |
          node --check clean/src/data/foods.js
          node --check clean/src/nutrition/catalog.js
          node --check clean/src/live/config-v1720.js
          node --check clean/src/live/draft-v1716.js
          node --check clean/src/live/generic-fallback-v1727.js
          node --check clean/src/nutrition/evidence-v1716.js

      - name: Gemini Live MEXT-grounded policy contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {SYSTEM_INSTRUCTION,UPDATE_MEAL_DRAFT_DECLARATION,buildSetupMessage} from './clean/src/live/config-v1720.js';
          const setup=buildSetupMessage().setup;
          assert.equal(setup.tools.length,1);
          assert.equal(setup.tools[0].functionDeclarations[0].name,'update_meal_draft');
          const props=UPDATE_MEAL_DRAFT_DECLARATION.parametersJsonSchema.properties.operations.items.properties;
          assert.ok(props.components);
          assert.deepEqual(props.nutritionSource.enum,['user-label']);
          assert.match(SYSTEM_INSTRUCTION,/文部科学省/);
          assert.match(SYSTEM_INSTRUCTION,/components/);
          assert.match(SYSTEM_INSTRUCTION,/P\/F\/C\/kcalを生成してはいけません/);
          assert.doesNotMatch(SYSTEM_INSTRUCTION,/Tavily公式検索/);
          console.log('MEXT-grounded Live policy: OK');
          NODE

      - name: CoCoIchi maps to MEXT-grounded curry composition
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__=[];
          const {LiveMealDraft}=await import('./clean/src/live/draft-v1716.js?test=1728');
          const draft=new LiveMealDraft();
          const result=draft.applyFunctionCall({id:'coco',args:{operations:[{op:'add',name:'CoCo壱番屋 ポークカレー ライス300g 辛さ普通'}]}});
          assert.equal(result.ready,true);
          const item=result.draft[0];
          assert.equal(item.nutritionEvidence.sourceType,'trusted-fallback');
          assert.match(item.nutritionEvidence.sourceLabel,/文部科学省/);
          assert.equal(item.nutritionEvidence.kcal,700);
          assert.equal(item.nutritionEvidence.p,13.1);
          assert.equal(item.nutritionEvidence.f,18.1);
          assert.equal(item.nutritionEvidence.c,126.7);
          assert.equal(item.genericFallback.sourceKind,'mext');
          assert.deepEqual(item.genericFallback.components.map(x=>x.name),['白米','ポークカレー']);
          console.log('CoCoIchi MEXT-grounded composition: OK');
          NODE

      - name: Raw AI PFC is rejected and MEXT component plan is accepted
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__=[];
          const {LiveMealDraft}=await import('./clean/src/live/draft-v1716.js?test=components1728');
          const blocked=new LiveMealDraft();
          assert.throws(()=>blocked.applyFunctionCall({id:'bad',args:{operations:[{op:'add',name:'謎の料理',p:20,f:10,c:30,kcal:300,nutritionSource:'ai-estimate'}]}}),/raw AI nutrition estimates are disabled/);
          const grounded=new LiveMealDraft();
          const r=grounded.applyFunctionCall({id:'good',args:{operations:[{op:'add',name:'推定料理',components:[{name:'白米',amount:200,unit:'g'},{name:'豚ひき肉',amount:100,unit:'g'}]}]}});
          assert.equal(r.ready,true);
          assert.equal(r.draft[0].nutritionEvidence.sourceType,'trusted-fallback');
          assert.match(r.draft[0].nutritionEvidence.sourceLabel,/文部科学省/);
          assert.throws(()=>new LiveMealDraft().applyFunctionCall({id:'unknown',args:{operations:[{op:'add',name:'推定料理',components:[{name:'存在しない食品',amount:100,unit:'g'}]}]}}),/unknown\/non-MEXT/);
          console.log('Raw AI blocked / MEXT component estimate: OK');
          NODE

      - name: MEXT source entries and cache bust are wired
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          globalThis.__PFC_CLEAN_BASE_FOOD_ROWS__=[];
          const data=await import('./clean/src/data/foods.js?test=1728');
          const byName=new Map(data.MEXT_ENTRIES.map(x=>[x.name,x]));
          for(const name of ['ポークカレー','チキンカレー','ビーフカレー','フライドポテト(市販冷凍)']) assert.ok(byName.has(name));
          assert.equal(byName.get('ポークカレー').source.itemNo,'18041');
          for(const path of ['index.html','clean/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/catalog\.js\?v=1\.7\.28/);
            assert.match(html,/config-v1720\.js\?v=1\.7\.28/);
            assert.match(html,/draft-v1716\.js\?v=1\.7\.28/);
          }
          console.log('MEXT entries + cache bust: OK');
          NODE
