<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PFC表示修復</title>
  <style>body{margin:0;background:#f4f8f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#183126}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:420px;width:100%;box-sizing:border-box;background:#fff;border:1px solid #dbe8e1;border-radius:22px;padding:28px;text-align:center;box-shadow:0 8px 32px rgba(12,52,34,.08)}.mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#187a51;color:#fff;font-weight:900}.msg{font-weight:900;font-size:19px}.sub{margin-top:8px;color:#68786f;line-height:1.7;font-size:14px}</style>
</head>
<body><div class="wrap"><div class="card"><div class="mark">PFC</div><div class="msg" id="msg">表示を修復しています…</div><div class="sub">このサイトの古い表示キャッシュだけを更新します。食事記録などの保存データは削除しません。</div></div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('tamafit-pfc-mirror-')).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('[PFC repair]',e);}
  const m=document.getElementById('msg');if(m)m.textContent='修復しました。最新版を開きます。';
  setTimeout(()=>location.replace('./?repair='+Date.now()),500);
})();
</script></body></html>
